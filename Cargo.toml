[package]
name = "crownos-accounts"
description = "Online accounts for CrownOS apps: OAuth sign-in, and tokens kept fresh on disk"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/crown-os/crownos-accounts"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
sha2 = "0.10"
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
thiserror = "2"
log = "0.4"
